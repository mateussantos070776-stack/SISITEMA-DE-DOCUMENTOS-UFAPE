<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel do Analista - UFAPE</title>
  <style>
    :root {
      --navy: #092653; --blue: #1558c0; --surface: #ffffff; --page: #f2f5fb;
      --line: #dfe7f2; --ink: #14213d; --muted: #65748b; --green: #13834f; --red: #c62828;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 20px; background: var(--page); font-family: Inter, sans-serif; color: var(--ink); }
    .container { max-width: 1400px; margin: 0 auto; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 12px rgba(0,0,0,.05); }
    table { width: 100%; border-collapse: collapse; text-align: left; margin-top: 10px; }
    th, td { padding: 12px; border-bottom: 1px solid var(--line); font-size: 13px; vertical-align: top; }
    th { color: var(--muted); background: #f8fafc; }
    select, input[type="text"] { width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 12px; }
    .btn { padding: 6px 10px; border: 0; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 11px; margin-top: 4px; }
    .btn-success { background: var(--green); color: white; }
    .btn-danger { background: var(--red); color: white; }
    .btn-secondary { background: #e2e8f0; color: #334155; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
      <h2>Painel de Análise - Documentos Individuais</h2>
      <button class="btn" style="background:var(--blue); color:#fff; padding:10px 15px;" onclick="carregarSubmissoes()">Atualizar Lista</button>
    </div>

    <div class="card" style="overflow-x:auto;">
      <table>
        <thead>
          <tr>
            <th>Candidato / CPF</th>
            <th>RG</th>
            <th>CPF Documento</th>
            <th>Foto 3x4</th>
            <th>ENEM</th>
          </tr>
        </thead>
        <tbody id="tabelaAnalise">
          <tr><td colspan="5" style="text-align:center; color:var(--muted);">A carregar submissões...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const obsPreProgramadas = [
      "Doc Aceito",
      "Doc Incompatível",
      "Doc Inelegível",
      "Reenviar"
    ];

    async function carregarSubmissoes() {
      const tbody = document.getElementById('tabelaAnalise');
      const res = await fetch('/api/documentos');
      const dados = await res.json();

      if (dados.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:var(--muted);">Nenhum candidato registado.</td></tr>';
        return;
      }

      tbody.innerHTML = dados.map(s => `
        <tr>
          <td><b>${s.candidato}</b><br><small style="color:var(--muted)">${s.cpf}</small></td>
          ${renderizarColunaDoc(s.cpf, 'RG', s.documentos.rg)}
          ${renderizarColunaDoc(s.cpf, 'CPF', s.documentos.cpfDoc)}
          ${renderizarColunaDoc(s.cpf, 'Foto 3x4', s.documentos.foto)}
          ${renderizarColunaDoc(s.cpf, 'ENEM', s.documentos.enem)}
        </tr>
      `).join('');
    }

    function renderizarColunaDoc(cpf, tipoKeyReal, doc) {
      const tipoMap = { 'RG': 'rg', 'CPF': 'cpfDoc', 'Foto 3x4': 'foto', 'ENEM': 'enem' };
      const key = tipoMap[tipoKeyReal];

      if (!doc || !doc.path) return `<td><span style="color:var(--muted)">Não enviado</span></td>`;

      return `
        <td>
          <a href="${doc.path}" target="_blank" download="${doc.nome}" style="font-weight:700; color:var(--blue); text-decoration:underline;">
            📄 Abrir / Baixar
          </a><br>
          <small>Status: <b style="color:${doc.status==='APROVADO'?'var(--green)':doc.status==='REJEITADO'?'var(--red)':'#b45309'}">${doc.status}</b></small>
          
          <select onchange="selecionarObs('${cpf}', '${key}', this.value)" style="margin-top:5px;">
            <option value="">-- Observação Rápida --</option>
            ${obsPreProgramadas.map(op => `<option value="${op}" ${doc.obs===op?'selected':''}>${op}</option>`).join('')}
          </select>
          
          <input type="text" id="obs-${cpf}-${key}" value="${doc.obs || ''}" placeholder="Observação livre...">
          
          <div style="display:flex; gap:4px; margin-top:5px;">
            <button class="btn btn-secondary" onclick="salvarItem('${cpf}', '${key}', null)">Salvar Obs</button>
            <button class="btn btn-success" onclick="salvarItem('${cpf}', '${key}', 'APROVADO')">Aprovar</button>
            <button class="btn btn-danger" onclick="salvarItem('${cpf}', '${key}', 'REJEITADO')">Rejeitar</button>
          </div>
        </td>
      `;
    }

    function selecionarObs(cpf, tipo, valor) {
      document.getElementById(`obs-${cpf}-${tipo}`).value = valor;
    }

    async function salvarItem(cpf, tipoDoc, novoStatus) {
      const observacao = document.getElementById(`obs-${cpf}-${tipoDoc}`).value;
      const payload = { cpf, tipoDoc, observacao };
      if (novoStatus) payload.status = novoStatus;

      const res = await fetch('/api/analisar-item', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (res.ok) {
        alert('Documento atualizado com sucesso!');
        carregarSubmissoes();
      } else {
        alert('Erro ao atualizar documento.');
      }
    }

    carregarSubmissoes();
  </script>
</body>
</html>
