<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Portal do Candidato - Envio e Consulta de Documentos</title>
  <style>
    :root {
      --bg-color: #f4f5f7;
      --card-bg: #ffffff;
      --text-main: #333333;
      --text-muted: #666666;
      --border-color: #d1d5db;
      --divider-color: #e5e7eb;
      --primary: #374151;
      --primary-hover: #1f2937;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 1050px;
      padding: 35px 40px;
      border-radius: 8px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      border: 1px solid #e5e7eb;
    }

    .logo-container {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo-container img {
      max-width: 70px;
      height: auto;
    }

    /* Layout em duas colunas com divisória suave */
    .grid-container {
      display: grid;
      grid-template-columns: 1fr 1px 1fr;
      gap: 35px;
      align-items: start;
    }

    .divisoria {
      background-color: var(--divider-color);
      width: 1px;
      height: 100%;
      min-height: 420px;
      border-radius: 1px;
    }

    @media (max-width: 850px) {
      .grid-container {
        grid-template-columns: 1fr;
        gap: 30px;
      }

      .divisoria {
        width: 100%;
        height: 1px;
        min-height: 1px;
        margin: 10px 0;
      }
    }

    .coluna {
      display: flex;
      flex-direction: column;
    }

    h2, h3 {
      color: var(--primary);
      border-bottom: 2px solid #f3f4f6;
      padding-bottom: 10px;
      margin-top: 0;
      text-align: center;
      font-size: 1.25rem;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 14px;
      color: var(--text-main);
    }

    input[type="text"],
    input[type="file"] {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 16px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
      background-color: #f9fafb;
      transition: border-color 0.2s, background-color 0.2s;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #9ca3af;
      background-color: #ffffff;
    }

    input[type="file"] {
      background-color: #ffffff;
      padding: 8px;
    }

    button {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      margin-top: 5px;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: var(--primary-hover);
    }

    #mensagem {
      margin-top: 15px;
      font-size: 14px;
      color: var(--text-muted);
    }

    ul {
      padding-left: 0;
      list-style: none;
      margin-top: 15px;
    }

    li {
      margin-bottom: 12px;
      font-size: 14px;
      background: #f9fafb;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #e5e7eb;
    }

    a {
      color: #2563eb;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .obs-box {
      margin-top: 8px;
      color: #374151;
      background-color: #f3f4f6;
      padding: 8px;
      border-radius: 4px;
      font-size: 13px;
    }

    .success-alert {
      background-color: #ecfdf5;
      border: 1px solid #10b981;
      color: #065f46;
      padding: 12px;
      border-radius: 6px;
      margin-top: 15px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-container">
      <img src="logo.png" alt="Logo">
    </div>

    <div class="grid-container">
      <!-- LADO ESQUERDO: CADASTRO E ENVIO -->
      <div class="coluna">
        <h2>Envio de Documentos</h2>
        <form id="uploadForm">
          <label>Nome Completo:</label>
          <input type="text" id="candidato" placeholder="Digite seu nome completo" required>
          
          <label>CPF:</label>
          <input type="text" id="cpf" placeholder="000.000.000-00" required>

          <label>Selecione o Documento (PDF/Imagem):</label>
          <input type="file" id="documento" required>
          
          <button type="submit">Enviar Documento</button>
        </form>

        <div id="mensagem"></div>
      </div>

      <!-- DIVISÓRIA SUAVE -->
      <div class="divisoria"></div>

      <!-- LADO DIREITO: CONSULTA DE RESULTADOS -->
      <div class="coluna">
        <h3>Consultar Meus Envios</h3>
        <label>Nome Completo:</label>
        <input type="text" id="buscaNome" placeholder="Digite seu nome completo">

        <label>CPF:</label>
        <input type="text" id="buscaCpf" placeholder="Digite seu CPF">

        <label>ID de Envio:</label>
        <input type="text" id="buscaId" placeholder="Digite seu ID de Envio">

        <button onclick="consultarStatus()" style="background-color: #4b5563;">Consultar Resultado</button>

        <div id="resultadoBusca"></div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData();
      formData.append('candidato', document.getElementById('candidato').value);
      formData.append('cpf', document.getElementById('cpf').value);
      formData.append('documento', document.getElementById('documento').files[0]);

      const res = await fetch('/api/upload', { method: 'POST', body: formData });
      const data = await res.json();

      if (res.ok) {
        document.getElementById('mensagem').innerHTML = `
          <div class="success-alert">
            <b>Documento enviado com sucesso!</b><br>
            Guarde o seu <b>ID de Envio: <span style="font-size: 16px; color: #047857;">${data.documento.id}</span></b>. Você precisará dele junto com seu CPF e Nome para consultar o resultado.
          </div>`;
        document.getElementById('uploadForm').reset();
      } else {
        document.getElementById('mensagem').innerText = `Erro: ${data.error}`;
      }
    });

    async function consultarStatus() {
      const nomeInput = document.getElementById('buscaNome').value.trim().toLowerCase();
      const cpfInput = document.getElementById('buscaCpf').value.trim().replace(/\D/g, '');
      const idBusca = document.getElementById('buscaId').value.trim();
      const div = document.getElementById('resultadoBusca');

      if (!nomeInput || !cpfInput || !idBusca) {
        alert('Por favor, preencha o Nome, o CPF e o ID de Envio para consultar.');
        return;
      }

      const res = await fetch('/api/documentos');
      const docs = await res.json();
      
      const meusDocs = docs.filter(d => {
        const docCpfClean = d.cpf.replace(/\D/g, '');
        const docNomeClean = d.candidato.trim().toLowerCase();
        
        return d.id === idBusca && 
               docCpfClean === cpfInput && 
               docNomeClean.includes(nomeInput);
      });
      
      if (meusDocs.length === 0) {
        div.innerHTML = '<p style="color: #b91c1c; margin-top: 15px;">Nenhum registro encontrado com a combinação informada.</p>';
        return;
      }

      div.innerHTML = '<ul>' + meusDocs.map(d => `
        <li>
          <div><b>ID de Envio:</b> ${d.id}</div>
          <div><b>Candidato:</b> ${d.candidato}</div>
          <div><b>Arquivo:</b> <a href="${d.path}" target="_blank">${d.nomeArquivo}</a></div>
          <div><b>Status:</b> <span style="color: ${d.status === 'APROVADO' ? '#047857' : d.status === 'REJEITADO' ? '#b91c1c' : '#b45309'}">${d.status}</span></div>
          <div class="obs-box"><b>Observação do Analista:</b> ${d.observacao && d.observacao.trim() !== '' ? d.observacao : 'Nenhuma observação informada.'}</div>
        </li>
      `).join('') + '</ul>';
    }
  </script>
</body>
</html>
